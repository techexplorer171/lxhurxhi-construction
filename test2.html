<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Build | London</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Impact', 'Arial Black', sans-serif; background-color: #121212; color: #ffffff; }
        a, a:visited { text-decoration: none; color: inherit; }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #1a1a1a;
            border-bottom: 4px solid #eab308; /* Industrial Safety Yellow */
        }
        .brand { font-size: 1.5rem; letter-spacing: 0.05em; color: #ffffff; text-transform: uppercase; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; font-family: system-ui, sans-serif; }
        .nav-links a { color: #a1a1aa; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover { color: #ffffff; }
        .nav-links .btn-estimate {
            background-color: #eab308;
            color: #000000 !important;
            padding: 0.6rem 1rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 2px;
        }

        /* Hero */
        .hero { padding: 5rem 2rem; }
        .hero h1 { font-size: 4rem; text-transform: uppercase; letter-spacing: 0.02em; color: #eab308; line-height: 1; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">IRONCLAD BUILD</div>
    <ul class="nav-links">
        <li><a href="#">Structural</a></li>
        <li><a href="#">Extensions</a></li>
        <li><a href="#">Commercial</a></li>
        <li><a href="#" class="btn-estimate">Get Estimate</a></li>
    </ul>
</nav>
<section class="hero">
    <h1>Solid Foundations.<br>Zero Hassle.</h1>
</section>
</body>
</html>
